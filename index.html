<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート避難ナビ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #map { height: 350px; width: 100%; border-radius: 0.75rem; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-shield-halved text-2xl"></i>
      <h1 class="font-bold text-xl tracking-wide">スマート避難ナビ</h1>
    </div>
    <span class="text-xs bg-red-700 px-2.5 py-1 rounded-full border border-red-500 font-mono">全国対応版</span>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-4">

    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 text-center space-y-3">
      <p class="text-sm text-slate-500 font-medium">現在地から全国の指定緊急避難場所をリアルタイム検索</p>
      
      <button id="locate-btn" onclick="initNavigation()" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 transition text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-red-200 flex items-center justify-center gap-2 text-base">
        <i class="fa-solid fa-location-crosshairs text-lg"></i>
        <span>現在地から近くの避難所を探す</span>
      </button>

      <div id="status-message" class="text-xs text-slate-500 pt-1 flex items-center justify-center gap-1">
        <i class="fa-solid fa-circle-info"></i> ボタンを押すと周辺3km以内の避難所を取得します
      </div>
    </div>

    <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200">
      <div id="map" class="z-10"></div>
    </div>

    <div class="flex items-center justify-between pt-2">
      <h2 class="font-bold text-slate-700 text-lg flex items-center gap-2">
        <i class="fa-solid fa-list-ol text-red-600"></i>
        <span>近くの避難所一覧</span>
      </h2>
      <span id="result-count" class="text-xs font-bold bg-slate-200 text-slate-600 px-2 py-1 rounded-md">0件</span>
    </div>

    <div id="shelter-list" class="space-y-3">
      <div class="bg-white p-6 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 text-sm">
        「避難所を探す」ボタンを押すと、現在地周辺の実際の避難所が表示されます。
      </div>
    </div>

  </main>

  <script>
    let map;
    let userMarker;
    let shelterMarkers = [];
    let userLocation = null;

    function initMap() {
      // 初期画面（東京周辺）
      map = L.map('map').setView([35.6812, 139.7671], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function initNavigation() {
      const statusEl = document.getElementById('status-message');
      const btn = document.getElementById('locate-btn');
      
      statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GPSを取得＆避難所データを検索中...';
      btn.disabled = true;

      if (!navigator.geolocation) {
        statusEl.innerHTML = '<span class="text-red-500">GPS機能に対応していません</span>';
        btn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          
          // マップ更新
          map.setView([userLocation.lat, userLocation.lng], 14);
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([userLocation.lat, userLocation.lng], {
            radius: 9, fillColor: '#2563eb', color: '#ffffff', weight: 3, opacity: 1, fillOpacity: 0.9
          }).addTo(map).bindPopup("現在地").openPopup();

          // 国土地理院・Overpass API等から現在地周辺(約3km)の避難所データを動的取得
          await fetchNearbyShelters(userLocation.lat, userLocation.lng);

          statusEl.innerHTML = '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check"></i> 周辺の避難所を取得しました</span>';
          btn.disabled = false;
        },
        (err) => {
          statusEl.innerHTML = '<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation"></i> 位置情報の取得に失敗しました</span>';
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // OpenStreetMap/Overpass APIから実データの避難場所を取得
    async function fetchNearbyShelters(lat, lng) {
      const listEl = document.getElementById('shelter-list');
      const countEl = document.getElementById('result-count');
      
      // 既存マーカー消去
      shelterMarkers.forEach(m => map.removeLayer(m));
      shelterMarkers = [];

      // 半径約3000m以内の避難所（emergency=assembly_point または shelter）をクエリ
      const query = `[out:json];(node["emergency"="shelter"](around:3000,${lat},${lng});node["emergency"="assembly_point"](around:3000,${lat},${lng});way["emergency"="shelter"](around:3000,${lat},${lng}););out center;`;
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        
        let shelters = data.elements.map(e => {
          const sLat = e.lat || (e.center && e.center.lat);
          const sLng = e.lon || (e.center && e.center.lon);
          const name = e.tags.name || e.tags["name:ja"] || "指定緊急避難場所（名称未登録）";
          const dist = calculateDistance(lat, lng, sLat, sLng);
          return { name, lat: sLat, lng: sLng, dist };
        }).filter(s => s.lat && s.lng);

        // 距離が近い順に並び替え
        shelters.sort((a, b) => a.dist - b.dist);

        countEl.innerText = `${shelters.length}件`;
        listEl.innerHTML = '';

        if (shelters.length === 0) {
          listEl.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-slate-500 text-sm">半径3km以内に登録されている避難場所が見つかりませんでした。</div>';
          return;
        }

        shelters.forEach((s, idx) => {
          const distLabel = s.dist < 1 ? `直線 約 ${Math.round(s.dist * 1000)} m` : `直線 約 ${s.dist.toFixed(2)} km`;
          const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;

          // マップ上にピン追加
          const marker = L.marker([s.lat, s.lng]).addTo(map);
          marker.bindPopup(`<b>${s.name}</b><br>${distLabel}`);
          shelterMarkers.push(marker);

          // カード生成
          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2";
          card.innerHTML = `
            <div class="flex justify-between items-start gap-2">
              <div>
                <span class="bg-red-100 text-red-700 font-bold text-[10px] px-2 py-0.5 rounded-full mb-1 inline-block">第 ${idx + 1} 候補</span>
                <h3 class="font-bold text-slate-800 text-base">${s.name}</h3>
              </div>
              <span class="font-bold text-red-600 text-sm whitespace-nowrap bg-red-50 px-2 py-1 rounded-md">${distLabel}</span>
            </div>
            <div class="pt-2 border-t border-slate-100">
              <a href="${mapUrl}" target="_blank" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 px-3 rounded-lg flex items-center justify-center gap-1">
                <i class="fa-solid fa-diamond-turn-right"></i>
                <span>Googleマップでルート確認</span>
              </a>
            </div>
          `;
          listEl.appendChild(card);
        });

      } catch (err) {
        listEl.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-red-500 text-sm">避難所データの取得に失敗しました。</div>';
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
